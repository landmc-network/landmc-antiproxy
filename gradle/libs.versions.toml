# Dependency versions for landmc-antiproxy.
#
# Only what this project adds on top of the platform. Okaeri, LiteCommands, Multification,
# HikariCP and ORMLite arrive with the platform modules.
[versions]

# Must match the version published by landmc-platform.
landmc-platform = "1.1.0"

# Velocity 4 publishes Java 25 bytecode, which is why this compiles with --release 25.
velocity = "4.1.1"

# Reads the local GeoLite2 .mmdb files, so a known-good ISP never reaches a paid API.
maxmind-geoip = "5.2.0"

# The driver production runs on; H2 is the out-of-the-box fallback for the address cache.
h2 = "2.4.240"
mariadb = "3.5.10"

shadow = "9.6.1"

junit = "6.1.3"
slf4j = "2.0.17"

[libraries]
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

platform-api = { module = "pl.landmc:platform-api", version.ref = "landmc-platform" }
platform-common = { module = "pl.landmc:platform-common", version.ref = "landmc-platform" }
platform-config = { module = "pl.landmc:platform-config", version.ref = "landmc-platform" }
platform-database = { module = "pl.landmc:platform-database", version.ref = "landmc-platform" }
platform-proxy = { module = "pl.landmc:platform-proxy", version.ref = "landmc-platform" }

maxmind-geoip = { module = "com.maxmind.geoip2:geoip2", version.ref = "maxmind-geoip" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
